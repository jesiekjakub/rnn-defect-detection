[project]
name = "rnn-defect-detection"
version = "0.2.0"
description = "Multi-label defect detection on synthetic 3-sensor time series, with an interactive Vue/FastAPI dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jakub Jęsiek" },
    { name = "Jakub Radziejewski" },
]
dependencies = [
    "fastapi>=0.115.0",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.0",
    "numba>=0.60.0",
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.7.0",
    "torch>=2.9.0",
    "umap-learn>=0.5.7",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
rnn-defect-detection = "rnn_defect_detection.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rnn_defect_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
